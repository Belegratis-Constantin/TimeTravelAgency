<div class="scrubber-label">Overview</div>
<div class="scrubber-track" (click)="onClick($event)">
  @for (zone of eraZones; track zone.name; let zi = $index) {
    <div class="segment" [class.divided]="zi > 0" [style.--accent]="zone.accent"
         [style.left.%]="(zone.pxStart / totalWidth) * 100" [style.width.%]="(zoneWidth / totalWidth) * 100">
      <span>{{ zone.shortLabel }}</span>
    </div>
  }
  @for (pin of pins(); track pin.trip.guid) {
    <div class="marker" [class.blink]="pin.phase === 'underway'" [style.--risk]="phaseColors[pin.phase]"
         [style.left.%]="(pin.x / totalWidth) * 100"></div>
  }
  <div class="viewport" [style.left.%]="viewportLeft()" [style.width.%]="viewportWidth()"></div>
</div>
<div class="coords">
  <div class="coords-year">{{ formatYear(currentYear()) }}</div>
  <div class="coords-sector">{{ activeZone().label }}</div>
</div>
