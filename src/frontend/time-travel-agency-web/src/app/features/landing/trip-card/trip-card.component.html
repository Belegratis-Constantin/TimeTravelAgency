<div (click)="selected.emit(trip.guid)"
     class="trip-card"
     style="background:#1E2A3A;border-radius:4px;overflow:hidden;
            box-shadow:0 18px 44px rgba(0,0,0,0.35);cursor:pointer;transition:transform 0.15s;">

  <div style="padding:22px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <div style="font-size:11px;color:#8A93A6;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">
        {{ typeLabel }}
      </div>
      <div style="font-family:'Fraunces',serif;font-weight:500;font-size:25px;">{{ displayName }}</div>
      <div style="font-size:13px;color:#C9A84C;margin-top:2px;">{{ departure }}</div>
    </div>
    <div [style.background]="statusMeta.bg" [style.color]="statusMeta.color"
         style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;">
      {{ statusMeta.label }}
    </div>
  </div>

  <div style="margin:18px 22px 0;padding-top:14px;border-top:1px solid rgba(240,237,230,0.08);
              display:flex;flex-direction:column;gap:9px;font-size:13px;color:#B7BFCC;">
    <div style="display:flex;justify-content:space-between;">
      <span style="color:#6B7488;">Departs</span><span>{{ departure }}</span>
    </div>
    <div style="display:flex;justify-content:space-between;">
      <span style="color:#6B7488;">Licensed Agent</span><span>{{ agentName }}</span>
    </div>
    <div style="display:flex;justify-content:space-between;">
      <span style="color:#6B7488;">Travelers</span><span>{{ trip.customers.length }} booked</span>
    </div>
  </div>

  <div style="padding:16px 22px 20px;font-size:12px;" [style.color]="until.color">
    {{ until.label }}
  </div>
</div>
